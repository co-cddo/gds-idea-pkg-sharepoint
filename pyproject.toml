[project]
name = "gds-idea-sharepoint"
description = "SharePoint operations via Microsoft Graph API: lists, document libraries and webhook subscriptions"
readme = "README.md"
authors = [
    { name = "Alex Pop", email = "alexandra.pop@digital.cabinet-office.gov.uk" },
    { name = "Jose Orjales", email = "jose.orjales@digital.cabinet-office.gov.uk" },
    { name = "David Gillespie", email = "david.gillespie@digital.cabinet-office.gov.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.20.0",
    "boto3>=1.40.63",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
# FastAPI webhook receiver: gds_idea_sharepoint.receiver
receiver = [
    "fastapi>=0.115.0",
]
# Receiver on AWS Lambda behind API Gateway
lambda = [
    "gds-idea-sharepoint[receiver]",
    "mangum>=0.19.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gds_idea_sharepoint"]

[tool.hatch.build.hooks.vcs]
version-file = "src/gds_idea_sharepoint/_version.py"
[tool.hatch.version]
source = "vcs"

[tool.gds-idea-app-kit]
framework = "python"
app_name = "gds-idea-sharepoint"
tool_version = "0.6.0"

[tool.gds-idea-app-kit.files]
LICENCE = "sha256:21cc325b3181cb748845827425d37ce04b3dc563835bbf50fafbc56a5eb68c48"
".github/CODEOWNERS" = "sha256:464aa53eb8be8c9b61185674b4dabec6cacbafa904aa48b46facdcd9a18e1fc5"
".github/workflows/ci.yml" = "sha256:94e94aed3b7403dd9b48afa77d8e9a9cb99702588aa81fad33c0e69932f827d5"
".github/dependabot.yml" = "sha256:8472c537c3808394c9200ac7f67e61ce565981583c6f7f381339f1df255fb318"
".pre-commit-config.yaml" = "sha256:376617ea56a3e3b6691e423e33c1faeff299e95205c54208bbd3b3a5c619bd57"
".github/workflows/release.yml" = "sha256:d2c22e66042f7f7fca4dc1066ff3ffaa4303df9c8a57953684a0a927731b1fe6"
[dependency-groups]
dev = [
    "gds-idea-sharepoint[lambda]",
    "pre-commit>=4.6.0",
    "pyngrok>=7.2.0",
    "pytest>=9.0.0",
    "python-dotenv>=1.2.1",
    "ruff>=0.14.0",
    "uvicorn>=0.34.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "integration: tests that require AWS credentials and a live SharePoint site",
    "webhook: tests that require a public notification URL for Microsoft Graph webhooks",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "src/gds_idea_sharepoint/_version.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "A", "PT"]
# E501 disabled: ruff format handles code line length.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["gds_idea_sharepoint"]
force-single-line = false
combine-as-imports = true
